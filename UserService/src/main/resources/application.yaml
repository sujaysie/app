spring:
  application:
    name: UserService
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:mysql://localhost:3306/productcatalog
    username: root
    password: MySql!@#123
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me-client-secret}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: https://accounts.google.com
server:
  port: 8082

auth:
  jwt:
    issuer: user-service
    audience: store-services
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
