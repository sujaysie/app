spring:
  application:
    name: ProductCatalogService
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:mysql://localhost:3306/productcatalog
    username: root
    password: MySql!@#123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      port: 6379
      host: localhost
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}

server:
  port: 8083

third:
  party:
    api: https://fakestoreapi.com

